<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="60" y="150" width="480" height="480" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="780" rx="32" fill="url(#bg)" />
  <rect x="1" y="1" width="598" height="778" rx="31" stroke="#334155" stroke-width="2" />

  <!-- Accent glow/badge -->
